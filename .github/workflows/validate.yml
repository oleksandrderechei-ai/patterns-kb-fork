name: validate

# The change workflow: the file docs/data/gates.json names for the `ci` run place. One named
# step per registered gate, each running exactly the command its row records as `wired` —
# check-gates-sync holds this file to the registry both ways, so a step no row claims, or a row
# with no step here, fails it. The registry's generated reference is docs/reference/gates.md;
# a red step's section is in docs/reference/triage.md.
#
# One job, every answer: each gate step carries an `if:` that asks only whether setup
# succeeded, so one red gate never hides the next and a branch with three findings costs one
# round trip — the same run `make validate` gives locally.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install repo tooling
        # npm ci, then the install stamp every make target checks.
        run: make install

      - name: Annotate findings on the diff
        # `id: setup` is load-bearing: every gate step below runs only when this, the last
        # setup step, succeeded. The problem matcher turns each finding line — the three shapes
        # of the gate contract — into an annotation on its file and line.
        id: setup
        run: echo "::add-matcher::.github/problem-matchers/kb-gates.json"

      - name: Type check
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node_modules/.bin/tsx tools/src/gates/check-types.ts

      - name: JSON sanity
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node_modules/.bin/tsx tools/src/gates/check-json.ts

      - name: Built output untracked
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node_modules/.bin/tsx tools/src/gates/check-build-untracked.ts

      - name: Gate registry in sync
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node_modules/.bin/tsx tools/src/gates/check-gates-sync.ts

      - name: Gate reference in sync
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node_modules/.bin/tsx tools/src/gen/gen-gates.ts --check

      - name: Test colocation
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node_modules/.bin/tsx tools/src/gates/check-test-colocation.ts

      - name: Context layers
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node_modules/.bin/tsx tools/src/gates/check-claude-md.ts

      - name: Command claims
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node_modules/.bin/tsx tools/src/gates/check-claims.ts

      - name: Trap inbox cap
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node_modules/.bin/tsx tools/src/gates/check-inbox.ts

      - name: Harness shape
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node_modules/.bin/tsx tools/src/gates/check-harness.ts

      - name: Harness routes
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node_modules/.bin/tsx tools/src/gates/check-harness-routes.ts

      - name: Page frontmatter
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node_modules/.bin/tsx tools/src/gates/check-doc-frontmatter.ts

      - name: Page shape
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node_modules/.bin/tsx tools/src/gates/check-docs-style.ts

      - name: KB page shape
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node_modules/.bin/tsx tools/src/gates/check-kb-shape.ts

      - name: Docs map
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node_modules/.bin/tsx tools/src/gates/check-docs-map.ts

      - name: Docs map in sync
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node_modules/.bin/tsx tools/src/gen/gen-map.ts --check

      - name: Diagrams parse
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node_modules/.bin/tsx tools/src/gates/check-mermaid.ts

      - name: Repository links
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node_modules/.bin/tsx tools/src/gates/check-repo-links.ts

      - name: Vocabulary bans
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node_modules/.bin/tsx tools/src/gates/check-vocabulary.ts

      - name: Glossary reference in sync
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node_modules/.bin/tsx tools/src/gen/gen-vocabulary.ts --check

      - name: Search synonyms hold their rules
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node_modules/.bin/tsx tools/src/gates/check-search-synonyms.ts

      - name: Search synonyms reference in sync
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node_modules/.bin/tsx tools/src/gen/gen-search-synonyms.ts --check

      - name: Search oracle answers
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node_modules/.bin/tsx tools/src/gates/check-search-oracle.ts

      - name: KB records hold their schema
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node_modules/.bin/tsx tools/src/gates/check-kb-records.ts

      - name: Product registry
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node_modules/.bin/tsx tools/src/gates/check-products.ts

      - name: Relations closed and paired
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node_modules/.bin/tsx tools/src/gates/check-relations.ts

      - name: Learning paths resolve
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node_modules/.bin/tsx tools/src/gates/check-learning-paths.ts

      - name: Tracks resolve
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node_modules/.bin/tsx tools/src/gates/check-tracks.ts

      - name: Tour order holds
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node_modules/.bin/tsx tools/src/gates/check-tour-order.ts

      - name: Prerequisite graph holds
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node_modules/.bin/tsx tools/src/gates/check-prerequisites.ts

      - name: Prerequisite graph in sync
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node_modules/.bin/tsx tools/src/gen/gen-prerequisites.ts --check

      - name: Relationships blocks in sync
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node_modules/.bin/tsx tools/src/gen/gen-relations.ts --check

      - name: Tour and fluency blocks in sync
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node_modules/.bin/tsx tools/src/gen/gen-tours.ts --check

      - name: Structure file
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node_modules/.bin/tsx tools/src/gates/check-site-structure.ts

      - name: Tags
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node_modules/.bin/tsx tools/src/gates/check-tags.ts

      - name: Tag reference in sync
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node_modules/.bin/tsx tools/src/gen/gen-taxonomy.ts --check

      - name: Site colour tokens
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node_modules/.bin/tsx tools/src/gates/check-site-tokens.ts

      - name: Site hook parity
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node_modules/.bin/tsx tools/src/gates/check-site-hooks.ts

      - name: Hook suite (bash)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node_modules/.bin/tsx tools/src/gates/check-bash-suite.ts

      - name: Gate suite (vitest)
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node_modules/.bin/tsx tools/src/gates/check-suite.ts

  # The site build and the gates that read the built site (spec kb.site.build-command). Its
  # own job, because it installs a headless Chromium and builds 400 pages — minutes of work
  # the gates above never wait for. The two setup steps after the matcher are the build: every
  # site-gate step reads `steps.build.outcome`, so no gate judges a site that did not build,
  # and one red gate never hides the next.
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # A runner without Chromium must fail the two browser gates, never pass by skipping them.
      KB_REQUIRE_BROWSER: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install repo tooling
        run: make install

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install headless Chromium
        # Playwright's browser and the system libraries it needs on the runner.
        run: make site-deps && node_modules/.bin/playwright install-deps chromium

      - name: Annotate findings on the diff
        id: setup
        run: echo "::add-matcher::.github/problem-matchers/kb-gates.json"

      - name: Build the site
        id: build
        run: make site-compile

      - name: Site portability
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node_modules/.bin/tsx tools/src/gates/check-site-portable.ts

      - name: Site and markdown agree
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node_modules/.bin/tsx tools/src/gates/check-site-parity.ts

      - name: Site noise and data layer
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node_modules/.bin/tsx tools/src/gates/check-site-absence.ts

      - name: Site built links
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node_modules/.bin/tsx tools/src/gates/check-site-links.ts

      - name: Site accessibility floor
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node_modules/.bin/tsx tools/src/gates/check-site-a11y.ts

      - name: Site accessibility in a browser
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node_modules/.bin/tsx tools/src/gates/check-site-axe.ts

      - name: Site size budget
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node_modules/.bin/tsx tools/src/gates/check-site-budget.ts

      - name: Site search facts
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node_modules/.bin/tsx tools/src/gates/check-site-seo.ts

      - name: Site reader flows
        # The reader's flows in the browser, after every site gate: the served projects start
        # their own static server over site/dist on a loopback port.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node_modules/.bin/tsx tools/src/gates/check-site-e2e.ts

