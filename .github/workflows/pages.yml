name: pages

# Builds the site from docs/ and deploys site/dist to GitHub Pages, then asks the live site a few
# questions.
#
# It validates before it ships: `make site-build` runs the lint, the site's unit tests, the
# build and the six site gates, and stops at the first failure, so a red build never deploys.
# Whatever is uploaded is what was just built and checked, including on a manual dispatch.
# SITE_URL is where the site will live; left unset, tools/src/site/site-output.ts's
# PUBLIC_ROOT is used, and the post-build pass writes the canonical links, og:url and the
# sitemap from it.
#
# Three jobs. `build` checks the site, fingerprints its index.json and uploads it; `deploy`
# publishes the upload; `smoke` waits until the live index.json has that fingerprint, then
# checks the answers a machine reader relies on (tools/src/site/site-smoke.ts; a finding's
# meaning is in docs/reference/triage.md, "Deployed site answers"). `smoke` needs `deploy`, so
# it runs only where a deploy ran, never on a pull request, and it can only mark the run red:
# the site stays as deployed.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "site/**"
      - "tools/**"
      - "package-lock.json"
      - "Makefile"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Least privilege at the workflow level; each job widens only what it needs.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # configure-pages creates the Pages site on first run. The job that runs the build's npm
    # scripts holds no OIDC token: only `deploy` does.
    permissions:
      pages: write
    outputs:
      index_sha: ${{ steps.fingerprint.outputs.index_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install repo tooling
        run: make install
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ hashFiles('package-lock.json') }}
      - name: Install headless Chromium
        # The site build draws every diagram in it.
        run: make site-deps && node_modules/.bin/playwright install-deps chromium
      - name: Build and check the site
        run: make site-build
      - name: Fingerprint the built index
        id: fingerprint
        # `smoke` waits until the live index.json has exactly these bytes, so it judges this
        # deploy and never the one before it. The file is taken as it is uploaded below.
        run: |
          set -euo pipefail
          sha="$(sha256sum site/dist/index.json | cut -d ' ' -f 1)"
          echo "index_sha=${sha}" >> "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@v5
        # Create the Pages site on first run instead of failing when Pages is not yet enabled.
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    # Longer than the wait for the live index.json (11 minutes at most): GitHub Pages lets a CDN
    # keep the previous build's copy for 10 minutes.
    timeout-minutes: 15
    permissions: {}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install repo tooling
        run: make install
      - name: Deployed site answers
        run: node_modules/.bin/tsx tools/src/site/site-smoke.ts --url "${{ needs.deploy.outputs.page_url }}" --index-sha "${{ needs.build.outputs.index_sha }}"
