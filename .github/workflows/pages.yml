name: pages

# Builds the site from docs/ and deploys site/dist to GitHub Pages.
#
# It validates before it ships: `make site-build` runs the lint, the site's unit tests, the
# build and the site gates, and stops at the first failure, so a red build never deploys.
# Whatever is uploaded is what was just built and checked, including on a manual dispatch.
# SITE_URL is where the site will live, and the post-build pass writes the canonical links,
# og:url and the sitemap from it. configure-pages reports the address this repository
# publishes to, so a renamed repository or a custom domain needs no edit here; left unset,
# tools/src/site/site-output.ts's PUBLIC_ROOT is used.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "site/**"
      - "tools/**"
      - "package-lock.json"
      - "Makefile"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Least privilege at the workflow level; the build job widens only what it needs.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        # Full history: each page's dateModified is the last commit that touched its source,
        # and a shallow clone knows only one commit.
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install repo tooling
        run: make install
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ hashFiles('package-lock.json') }}
      - name: Install headless Chromium
        # The site build draws every diagram in it.
        run: make site-deps && node_modules/.bin/playwright install-deps chromium
      - id: pages
        uses: actions/configure-pages@v5
        # Create the Pages site on first run instead of failing when Pages is not yet enabled.
        # It runs before the build because the build needs its base_url.
        with:
          enablement: true
      - name: Build and check the site
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: make site-build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
      - id: deployment
        uses: actions/deploy-pages@v4
